    <!-- LCP Image Preload - discover the LCP image early.
         Cached per path in sessionStorage so repeat views never hit the backend,
         and hard-aborted after 800ms so it can never delay paint. -->
    <script>
      (function(){
        var p = location.pathname || '/';
        var key = 'lcp_preload:' + p;

        function addPreload(d){
          if (!d || !d.imageUrl) return;
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = d.imageUrl;
          l.fetchPriority = 'high';
          if (d.srcset) {
            l.imageSrcset = d.srcset;
            l.imageSizes = '(max-width: 768px) 100vw, 66vw';
          }
          document.head.appendChild(l);
        }

        try {
          var cached = sessionStorage.getItem(key);
          if (cached) { addPreload(JSON.parse(cached)); return; }
        } catch(e){}

        var base = 'https://zdpdvwhvukelzzbzbjvh.supabase.co/functions/v1/lcp-preload';
        var x = new XMLHttpRequest();
        x.open('GET', base + '?path=' + encodeURIComponent(p), true);
        x.timeout = 800;
        x.onload = function(){
          try {
            var d = JSON.parse(x.responseText);
            try { sessionStorage.setItem(key, JSON.stringify(d)); } catch(e){}
            addPreload(d);
          } catch(e){}
        };
        x.send();
      })();
    </script>
